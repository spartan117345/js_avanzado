<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Demostración: Validación de Formularios</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Validación Avanzada de Formularios</h1>
  <form id="form-registro" novalidate> <!-- novalidate permite personalizar burbujas o mensajes [32] -->
    <div>
      <label for="email">Correo Electrónico (@example.com):</label>
      <input type="email" id="email" required minlength="8">
      <span class="error" id="error-email" aria-live="polite"></span>
    </div>
    <button type="submit">Registrarse</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
