<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala del Sistema Solar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🌌 Escala del Sistema Solar</h1>
        <p>Explora las órbitas de los planetas alrededor del Sol</p>
    </header>

    <main>
        <canvas id="sistemaSolar"></canvas>

        <section class="controles">
            <button id="pausar">⏸ Pausar</button>
            <button id="reiniciar">↻ Reiniciar</button>
        </section>

        <p class="nota">
            Las distancias orbitales son aproximadas y están comprimidas
            para facilitar la visualización. Los tamaños de los planetas
            tampoco están a escala.
        </p>
    </main>

    <script src="app.js"></script>
</body>
</html>
